<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dobro.web — личный консультант по банковским продуктам</title>
<meta name="description" content="dobro.web — бесплатные консультации и помощь с дебетовыми картами, регистрацией ИП и РКО. Онлайн-сопровождение.">
<script>
  /* Тема: по умолчанию тёмная, выбор пользователя запоминается */
  try{
    var t = localStorage.getItem("theme");
    if(t === "light" || t === "dark"){ document.documentElement.setAttribute("data-theme", t); }
  }catch(e){}
</script>
<style>
  /* ===== Тёмная тема (основная) ===== */
  :root,
  :root[data-theme="dark"]{
    --text:#eaf0ff;
    --text-soft:#9fb0d0;
    --accent:#2f6bff;
    --accent-dark:#1f52d4;
    --accent-text:#7fa6ff;
    --accent-tint:rgba(47,107,255,.16);
    --line:#1c2a4d;
    --line-hover:#34508f;
    --bg:#070d1c;
    --bg-alt:#0a1226;
    --card:#0e1730;
    --header-bg:rgba(7,13,28,.82);
    --shadow:0 14px 34px rgba(0,0,0,.45);
    --btn-shadow:0 8px 22px rgba(47,107,255,.35);
    --cta-bg:linear-gradient(135deg,#13296b,#0b1a45);
    --photo-bg:linear-gradient(145deg,#12224a,#0c1733);
    --hero-glow:rgba(47,107,255,.22);
    --radius:18px;
    color-scheme:dark;
  }
  /* ===== Светлая тема ===== */
  :root[data-theme="light"]{
    --text:#0f1f3d;
    --text-soft:#44506a;
    --accent:#2f6bff;
    --accent-dark:#1f52d4;
    --accent-text:#2f6bff;
    --accent-tint:#eef3ff;
    --line:#e3e8f2;
    --line-hover:#cfdaf5;
    --bg:#ffffff;
    --bg-alt:#f6f8fc;
    --card:#ffffff;
    --header-bg:rgba(255,255,255,.88);
    --shadow:0 10px 30px rgba(15,31,61,.08);
    --btn-shadow:0 8px 20px rgba(47,107,255,.28);
    --cta-bg:#0f1f3d;
    --photo-bg:linear-gradient(145deg,#dfe8ff,#f0f4ff);
    --hero-glow:#eef3ff;
    color-scheme:light;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--text);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;
    transition:background .35s ease,color .35s ease;
  }
  a{color:inherit;text-decoration:none}
  .container{width:min(1120px,100% - 40px);margin-inline:auto}
  section{padding:88px 0}
  h1,h2,h3{line-height:1.2;letter-spacing:-.02em}
  h2{font-size:clamp(28px,4vw,38px);margin-bottom:12px}
  .eyebrow{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text);margin-bottom:14px}
  .lead{color:var(--text-soft);font-size:18px;max-width:620px}
  .section-head{margin-bottom:48px}

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 26px;border-radius:999px;font-weight:600;font-size:16px;
    border:2px solid var(--accent);cursor:pointer;
    transition:transform .25s ease,box-shadow .25s ease,background .25s ease,color .25s ease;
  }
  .btn-primary{background:var(--accent);color:#fff;box-shadow:var(--btn-shadow)}
  .btn-primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);transform:translateY(-2px);box-shadow:0 12px 26px rgba(47,107,255,.4)}
  .btn-ghost{background:transparent;color:var(--accent-text)}
  .btn-ghost:hover{background:var(--accent-tint);transform:translateY(-2px)}
  .btn svg{width:18px;height:18px;transition:transform .25s ease}
  .btn:hover svg{transform:translateX(3px)}

  /* Header */
  header{position:sticky;top:0;z-index:50;background:var(--header-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);transition:background .35s,border-color .35s}
  .nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.02em}
  .logo-mark{width:36px;height:36px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
  .nav-links{display:flex;gap:30px;font-weight:500;color:var(--text-soft)}
  .nav-links a{position:relative;transition:color .25s}
  .nav-links a::after{content:"";position:absolute;left:0;bottom:-6px;width:0;height:2px;background:var(--accent);transition:width .3s}
  .nav-links a:hover{color:var(--text)}
  .nav-links a:hover::after{width:100%}
  .nav-right{display:flex;align-items:center;gap:12px}
  .nav .btn{padding:10px 20px;font-size:15px}

  /* Theme toggle */
